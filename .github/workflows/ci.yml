name: CI
on: [push]

jobs:
  test-lib:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Set up Purescript and Spago
        run: |
          npm i -g purescript
          npm i -g spago@next

      - name: Build
        run: spago build --strict

      - name: Test
        run: spago test --strict

  test-create:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      
      - name: Clean install dependencies
        run: cd create-distortion-app && npm ci
      
      - name: Run tests
        run: cd create-distortion-app && npm run test
